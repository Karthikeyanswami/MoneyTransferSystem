<div class="rv-root">

  <div *ngIf="loading" class="rv-loading">Loading rewards…</div>

  <div *ngIf="error" class="rv-error">
    <i class="ti ti-alert-circle" aria-hidden="true"></i> {{ error }}
  </div>

  <ng-container *ngIf="!loading && !error && rewards">

    <div class="rv-hero">
      <div class="rv-ring-wrap" aria-hidden="true">
        <svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#7F77DD"/>
              <stop offset="100%" stop-color="#EF9F27"/>
            </linearGradient>
          </defs>
          <circle cx="65" cy="65" r="54" fill="none" stroke="#EEEDFE" stroke-width="11"/>
          <circle cx="65" cy="65" r="54" fill="none" stroke="url(#ringGrad)" stroke-width="11"
            stroke-linecap="round"
            [attr.stroke-dasharray]="339"
            [attr.stroke-dashoffset]="339 - (339 * progressPercent / 100)"
            transform="rotate(-90 65 65)"/>
        </svg>
        <div class="rv-ring-center">
          <span class="rv-pts-big">{{ rewards }}</span>
          <span class="rv-pts-lbl">points</span>
        </div>
      </div>

      <div class="rv-right">
        <p class="rv-tier-name">{{ currentTier.name }}</p>
        <p class="rv-tier-sub">
          <ng-container *ngIf="currentTier.next; else maxTier">
            {{ ptsToNextTier }} pts to {{ currentTier.next }}
          </ng-container>
          <ng-template #maxTier>Maximum tier reached</ng-template>
        </p>
        <div class="rv-bar" role="progressbar"
             [attr.aria-valuenow]="progressPercent"
             aria-valuemin="0" aria-valuemax="100">
          <div class="rv-bar-fill" [style.width.%]="progressPercent"></div>
        </div>
        <p class="rv-bar-label">
          {{ rewards }} / {{ currentTier.nextAt ?? '∞' }} pts
        </p>
      </div>
    </div>

    <div class="rv-tiers">
      <div *ngFor="let t of TIERS"
        class="rv-tier-card"
        [ngClass]="[t.cssClass, isTierActive(t.name) ? 'active' : (isTierUnlocked(t.min) ? 'unlocked' : 'locked')]">
        <span class="rv-tier-icon">{{ t.icon }}</span>
        <span class="rv-tier-card-name">{{ t.name }}</span>
        <span class="rv-tier-card-pts">{{ t.min === 0 ? '0' : (t.min | number) }} pts</span>
      </div>
    </div>

    <div class="rv-hint">
      <i class="ti ti-bulb" aria-hidden="true"></i>
      <span>{{ hintText }}</span>
    </div>

  </ng-container>
</div>
